server:
  port: 8085

spring:
  application:
    name: file-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8084/.well-known/jwks.json"
  datasource:
    url: jdbc:mysql://localhost:3306/fileservice?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  servlet:
    multipart:
      max-request-size: 20MB
      max-file-size: 20MB


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


storage:
  local:
    path: D:/files
