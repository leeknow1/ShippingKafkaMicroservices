server:
  port: 8084

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/userservice?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: "http://localhost:8084/.well-known/jwks.json"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    issuer: http://user-service:8084
    kid: auth-key-1
    private-key-path: "classpath:keys/jwt-private.pem"
    public-key-path: "classpath:keys/jwt-public.pem"
    access-ttl-seconds: 900

logging:
  level:
    org.springframework.security: DEBUG
